name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # task:contract / screen:contract 가 Python 스크립트를 실행한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run task:contract
      - run: npm run screen:contract -- --mode=ci
      - run: npm run build

  public-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Supabase Secret 없이 실행하는 공개 Smoke 2종(public-smoke, travel-tools)만 필수 Gate다.
      # 인증 Smoke(auth-smoke)는 테스트 계정 Secret이 필요해 필수 Gate에서 제외한다.
      # 외부 이동 주소는 공개 일반 주소라 Secret이 아니다. 설정해 두면 새 탭 호출의 쿼리 없음까지 검증한다.
      - run: >-
          npx playwright test --project=chromium --pass-with-no-tests
          tests/e2e/public-smoke.spec.ts tests/e2e/travel-tools.spec.ts
        env:
          FLIGHT_OUTBOUND_URL: https://www.google.com/travel/flights
          HOTEL_OUTBOUND_URL: https://www.google.com/travel/hotels
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
